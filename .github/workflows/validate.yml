name: Validate

on:
  push:
    branches: ["main", "v[0-9]+", "v[0-9]+.[0-9]+"]
    tags-ignore: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  validate:
    uses: anthochamp/dev-toolbox/.github/workflows/node-validate.yml@246954aae0ae6ba5611890b1ab3d9bb1273ef11f # main
    with:
      node-package-manager: "yarn"
