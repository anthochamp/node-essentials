    branches: ["main", "v[0-9]+", "v[0-9]+.[0-9]+"]
    tags-ignore: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  validate:
    uses: anthochamp/dev-toolbox/.github/workflows/node-validate.yml@bd4502879fa8fc2072ce954b20e4a14c8b6a8591 # main
    with:
      node-package-manager: "yarn"
