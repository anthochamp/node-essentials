name: Validate

on:
  push:
    branches: ["main", "v[0-9]+", "v[0-9]+.[0-9]+"]
    tags-ignore: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  validate:
    uses: anthochamp/dev-toolbox/.github/workflows/node-validate.yml@01bc7864a1b72e05343f09d75c2bb3ce1e46e08f # main
    with:
      node-package-manager: "yarn"

  # The documentation sites import package sources directly, so a breaking
  # change to an exported symbol fails here rather than at publish time.
  build_doc_sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install and enable corepack
        run: |
          npm install -g corepack
          corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install
      - name: Build every site
        run: |
          for site_dir in website/*/; do
            [ -f "$site_dir/package.json" ] || continue
            site=$(basename "$site_dir")
            echo "::group::Building $site"
            yarn workspace "website-$site" run build
            echo "::endgroup::"
          done
