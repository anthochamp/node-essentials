    branches: ["main", "v[0-9]+", "v[0-9]+.[0-9]+"]
    tags-ignore: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

jobs:
  validate:
    uses: anthochamp/dev-toolbox/.github/workflows/node-validate.yml@0524b9507c8d38a6b0933b83399c83b3dbb76ab1 # main
    with:
      node-package-manager: "yarn"
