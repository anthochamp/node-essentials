name: Validate

on:
  push:
    branches: ["main", "v[0-9]+", "v[0-9]+.[0-9]+"]
    tags-ignore: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# The Node jobs below are hand-rolled rather than delegated to dev-toolbox's
# `node-validate.yml`: this workspace needs a Rust toolchain, a WASM build, an
# Astro type-generation pass and a cached corpus download before `lint`, `test`
# or `compile:check` can run, and a reusable workflow offers no hook to insert
# steps between its own install and script steps.
jobs:
  common-lint:
    uses: anthochamp/dev-toolbox/.github/workflows/common-lint.yml@5d65687d55ebfc004ef3677263e2d067a405ba83 # main
    with:
      node-package-manager: "yarn"
      node-version-file: ".nvmrc"

  node-common-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the workspace
        uses: ./.github/actions/prepare
        with:
          astro-types: "true"
      - name: Check formatting
        run: yarn format:check
      - name: Lint
        run: yarn lint
      - name: Check TypeScript typings
        run: yarn compile:check

  node-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the workspace
        uses: ./.github/actions/prepare
        with:
          fixtures: "true"
      - name: Run tests
        run: yarn test

  # The documentation sites import package sources directly, so a breaking
  # change to an exported symbol fails here rather than at publish time.
  build_doc_sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the workspace
        uses: ./.github/actions/prepare
      - name: Build every site
        run: |
          for site_dir in website/*/; do
            [ -f "$site_dir/package.json" ] || continue
            site=$(basename "$site_dir")
            echo "::group::Building $site"
            yarn workspace "website-$site" run build
            echo "::endgroup::"
          done
