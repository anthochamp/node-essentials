name: Publish Package and Docs

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description:
          "Publish in dry-run mode (no actual publishing or GitHub Release)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      published-tags: ${{ steps.publish.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare the workspace
        uses: ./.github/actions/prepare
        with:
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        id: publish
        shell: bash
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            yarn build
            yarn workspaces foreach -A --no-private npm publish --dry-run
            exit 0
          fi
          yarn changeset:publish | tee publish.log
          tags=$(sed -n 's/^.*New tag: *//p' publish.log)
          {
            echo "tags<<GH_EOF"
            echo "$tags"
            echo "GH_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Push release tags
        if: inputs.dry-run != 'true' && steps.publish.outputs.tags != ''
        run: git push --follow-tags

  generate_and_publish_doc:
    permissions:
      contents: write
      pages: write
    needs: publish
    runs-on: ubuntu-latest
    if: inputs.dry-run != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the workspace
        uses: ./.github/actions/prepare
      - name: Build the documentation sites
        run: yarn doc:publish

  release:
    permissions:
      contents: write
    needs: publish
    runs-on: ubuntu-latest
    if:
      ${{ inputs.dry-run != 'true' && needs.publish.outputs.published-tags != ''
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release for each published package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ needs.publish.outputs.published-tags }}
        run: |
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            gh release create "$TAG" --title "$TAG" --generate-notes
          done <<< "$PUBLISHED_TAGS"
