name: Publish Package and Docs

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description:
          "Publish in dry-run mode (no actual publishing or GitHub Release)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      published-tags: ${{ steps.publish.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare the workspace
        uses: ./.github/actions/prepare
        with:
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        id: publish
        shell: bash
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            yarn build
            yarn workspaces foreach -A --no-private npm publish --dry-run
            exit 0
          fi
          yarn changeset:publish | tee publish.log
          tags=$(sed -n 's/^.*New tag: *//p' publish.log)
          {
            echo "tags<<GH_EOF"
            echo "$tags"
            echo "GH_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Push release tags
        if: inputs.dry-run != 'true' && steps.publish.outputs.tags != ''
        run: git push --follow-tags

  generate_and_publish_doc:
    permissions:
      contents: write
      pages: write
    needs: publish
    runs-on: ubuntu-latest
    if: inputs.dry-run != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare the workspace
        uses: ./.github/actions/prepare
      - name: Build the documentation sites
        run: |
          # Each site builds its own API reference through starlight-typedoc,
          # keyed on the npm package name. The per-package `doc/generated` HTML
          # this replaced was keyed on the directory basename, so `core` and
          # `net-core` — and `math-random` and `crypto-random` — overwrote each
          # other in the published tree.
          for site_dir in website/*/; do
            [ -f "$site_dir/package.json" ] || continue
            site=$(basename "$site_dir")
            echo "::group::Building $site"
            yarn workspace "website-$site" run build
            echo "::endgroup::"
          done
      - name: Assemble the GitHub Pages tree
        run: |
          # One Pages site per repository, so the kit site owns the root and
          # every other site takes a subdirectory named after its workspace.
          # Matches each site's own `base`, which must agree or its internal
          # links break.
          mkdir gh-pages
          cp -r website/kit/dist/. gh-pages/
          for site_dir in website/*/; do
            site=$(basename "$site_dir")
            [ "$site" = "kit" ] && continue
            [ -d "$site_dir/dist" ] || continue
            mkdir -p "gh-pages/$site"
            cp -r "$site_dir/dist/." "gh-pages/$site/"
          done
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          force_orphan: true

  release:
    permissions:
      contents: write
    needs: publish
    runs-on: ubuntu-latest
    if:
      ${{ inputs.dry-run != 'true' && needs.publish.outputs.published-tags != ''
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release for each published package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_TAGS: ${{ needs.publish.outputs.published-tags }}
        run: |
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            gh release create "$TAG" --title "$TAG" --generate-notes
          done <<< "$PUBLISHED_TAGS"
