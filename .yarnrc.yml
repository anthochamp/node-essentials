afterInstall: yarn postinstall

approvedGitRepositories: []

#npmPublishProvenance: true

enableTelemetry: false

nodeLinker: pnpm

# TypeDoc loads a plugin by bare specifier from its own install directory, which
# the pnpm linker isolates — so a plugin declared by the consuming workspace is
# invisible to it. `starlight-typedoc` always appends the bare name, leaving no
# way to pass a resolved path instead.
packageExtensions:
  "typedoc@*":
    dependencies:
      typedoc-plugin-markdown: "4.13.0"

plugins:
  - checksum: 44a06a583a46ab1e2de2a04c115868bea51f01a314f261b628fbf6d92b2be63c0d155be3d3094d440daf58ff3f263aba4c9384a1c60c5d26cc0db086ad990459
    path: .yarn/plugins/@yarnpkg/plugin-after-install.cjs
    spec: "https://raw.githubusercontent.com/mhassan1/yarn-plugin-after-install/v0.7.0/bundles/@yarnpkg/plugin-after-install.js"

catalog:
  "@types/content-disposition": "^0.5.9"
